<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17465A">
<title>Teste de Visão Relâmpago · Zona Óptica</title>
<script src="lib/mqtt.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/matter.min.js"></script>
<style>
:root{--ink:#17465A;--mute:#6f8b97;--line:#d5e9f3;--accent:#34A7DE;--claro:#EAF6FC;--ok:#1FA971;--erro:#E5484D;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#fff;color:var(--ink);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}

/* ECRÃ */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff}
.brand{padding:4vh 4vw 0;font-size:2.2vh;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:2vh 6vw}
.foot{padding:0 4vw 3vh;display:flex;justify-content:space-between;align-items:center;font-size:1.4vh;color:var(--mute)}
.dot{display:inline-block;width:.9vh;height:.9vh;border-radius:50%;background:#ccc}
.dot.on{background:var(--ok)}.dot.off{background:var(--erro)}
.attract{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4vh}
.attract.duo{display:grid;grid-template-columns:1fr 1fr;gap:3vw;width:100%;padding-left:24vw;align-items:center}
.attract.duo .col{display:flex;flex-direction:column;align-items:center;gap:3vh}
.demo{width:30vh;height:30vh;border:.25vh solid var(--line);border-radius:3vh;display:flex;align-items:center;justify-content:center}
.demo svg{fill:#000;transition:opacity .2s}
.dpad{display:flex;gap:1.6vh}
.dpad span{width:6vh;height:6vh;border-radius:50%;border:.25vh solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:3vh;color:var(--ink);transition:background .15s,color .15s,transform .15s}
.dpad span.on{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.15)}
.rec{font-size:2.4vh;color:var(--ink);font-weight:600}
.rec b{color:var(--accent)}
.masc.top{flex-direction:column-reverse;align-items:flex-start;gap:1.5vh}
.masc.top .bub{margin-bottom:0;max-width:22vw}
.masc.top .bub::after{left:7vh;bottom:-1.1vh;transform:rotate(-45deg)}
body.kiosk{cursor:none}body.kiosk .fsBtn{display:none}
/* Cobra */
.cBoard{flex:1;min-height:0;min-width:0;display:flex;padding:2vh 0 0 16vw}
.cArea{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.cArea canvas{background:var(--claro);border-radius:1.5vh;outline:.3vh solid var(--line)}
.demo canvas{border-radius:2vh}
.demo.gDemoBox{width:50vh}
.masc.small.top .bub{margin-bottom:0;max-width:14vw;font-size:1.9vh}
/* Pares de óculos (memória) */
.cArea{position:relative}
.mGrid{position:absolute;inset:0;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.6vh}   /* 4 x 3; o tamanho é posto em píxeis por memMedida() */
.mMini{width:88%;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vh}
.mCarta{aspect-ratio:1/1;min-height:0;border-radius:1.6vh;background:var(--ink);color:#fff;font-size:3vh;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;outline:.35vh solid transparent}
.mGrid .mCarta{aspect-ratio:auto}
.mCarta.up{background:#fff;outline-color:var(--accent);transform:scale(1.04)}
.mCarta.ok{background:#fff;outline-color:var(--ok);opacity:.72}
.mCarta img{max-width:86%;max-height:86%;object-fit:contain;display:block}
/* Menu de jogos (só para a equipa) */
/* --u: 1vh num ecrã 16:9; em ecrãs mais estreitos encolhe com a largura, para os cinco cartões caberem sempre numa fila */
.menu{--u:min(1vh,.5625vw);position:fixed;inset:0;z-index:15;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(4*var(--u));padding:4vw;text-align:center;cursor:default}
.menu h2{font-size:calc(5.5*var(--u));font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.menu .lista{display:flex;gap:calc(1.6*var(--u));justify-content:center;align-items:stretch}
.mJogo{--dv:calc(.66*var(--u));width:calc(30*var(--u));padding:calc(2*var(--u));border:calc(.4*var(--u)) solid var(--line);border-radius:calc(2.4*var(--u));background:#fff;display:flex;flex-direction:column;gap:calc(1.2*var(--u));align-items:center;justify-content:flex-start;transition:border-color .15s,background .15s,box-shadow .15s}
.mJogo>b{font-size:calc(2.6*var(--u));line-height:1.15;color:var(--ink)}
.mJogo>span{font-size:calc(1.8*var(--u));color:var(--mute);line-height:1.3}
.mJogo>em{font-style:normal;font-size:calc(1.7*var(--u));font-weight:700;color:var(--accent);min-height:calc(2*var(--u));margin-top:auto}
.mJogo:focus,.mJogo:hover{outline:none;border-color:var(--accent);background:var(--claro);box-shadow:0 calc(.8*var(--u)) calc(2.4*var(--u)) rgba(23,70,90,.18)}
/* Demonstração de cada jogo dentro do cartão: a mesma do ecrã de espera, em ponto pequeno (sem título nem setas) */
.mJogo>h1,.mJogo>.dpad{display:none}
.mJogo .demo{flex:none;width:calc(20*var(--u));height:calc(20*var(--u));border-radius:calc(2*var(--u));background:#fff;pointer-events:none;overflow:hidden}
.mJogo .demo.gDemoBox{width:calc(25*var(--u))}
.mJogo .mMini{gap:calc(.8*var(--u))}
.mJogo .mCarta{border-radius:calc(1*var(--u));font-size:calc(2*var(--u))}
.menu p{font-size:calc(2*var(--u));color:var(--mute)}
.attract h1{font-size:7vh;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.attract .qr svg{width:42vh;height:42vh;display:block}
.attract .sub{font-size:2.6vh;color:var(--mute)}
.attract .sub b{color:var(--accent);font-weight:700}
.warn{font-size:1.6vh;color:var(--erro)}
.center{text-align:center}
.center h2{font-size:6vh;font-weight:700;letter-spacing:-.02em}
.center p{font-size:2.6vh;color:var(--mute);margin-top:1.5vh}
.big{font-size:28vh;font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--accent)}
.play{width:100%;height:100%;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;font-size:2.2vh;color:var(--mute);font-variant-numeric:tabular-nums}
.lives{letter-spacing:.6vh;color:var(--accent)}
.tbar{height:2px;background:var(--line);margin-top:1.5vh}
.tbar div{height:100%;background:var(--accent);width:100%}
.eBox{flex:1;display:flex;align-items:center;justify-content:center}
.eWrap{transition:background .25s}
.eWrap:has(.eBox.ok){background:var(--claro)}.eWrap:has(.eBox.ko){background:#fdf2f2}
.eBox svg{fill:#000;position:relative;z-index:2}
.eWrap{flex:1;position:relative;display:flex;overflow:hidden}
.dz{position:absolute;left:0;top:0;z-index:1;pointer-events:none;white-space:nowrap;font-weight:700;letter-spacing:-.02em;will-change:transform}
.dz img{display:block;height:1em;width:auto}
#tri{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.result .score{font-size:20vh;font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--accent)}
.fsBtn{position:fixed;right:2vw;top:3.5vh;z-index:5;font-size:1.4vh;color:var(--mute);opacity:.6}

/* Mascote */
.masc{position:absolute;left:2vw;bottom:5.5vh;z-index:6;pointer-events:none;display:flex;align-items:flex-end;gap:1vw;transition:transform .5s}
.masc img{height:40vh;width:auto;display:block;transition:height .5s;transform-origin:50% 100%}
.masc.small img{height:19vh}
.masc.hop img{animation:hop .55s ease-out}
.masc.idle img{animation:sway 3.2s ease-in-out infinite}
@keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-9%) scale(1.03,.98)}60%{transform:translateY(0) scale(.98,1.02)}100%{transform:none}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.bub{position:relative;margin-bottom:22vh;max-width:24vw;background:#fff;border:.25vh solid var(--ink);border-radius:2.2vh;padding:1.4vh 1.8vh;
  font-size:2.5vh;font-weight:600;line-height:1.25;color:var(--ink);opacity:0;transform:translateY(1vh) scale(.96);transition:opacity .25s,transform .25s;transform-origin:0 100%}
.masc.small .bub{margin-bottom:10vh;font-size:2.1vh;max-width:22vw}
.bub.on{opacity:1;transform:none}
.bub::after{content:"";position:absolute;left:-1.1vh;bottom:1.6vh;width:1.8vh;height:1.8vh;background:#fff;border-left:.25vh solid var(--ink);border-bottom:.25vh solid var(--ink);transform:rotate(45deg)}
.pMasc{display:block;height:150px;width:auto;margin:0 auto}
.pMasc.hop,.mid img.hop{animation:hop .5s ease-out}
.mid img{display:block;height:84px;width:auto;margin:0 auto 2px;transform-origin:50% 100%}

/* Estatísticas */
.stats{position:fixed;inset:6vh 12vw;background:#fff;z-index:20;border:1px solid var(--line);border-radius:12px;
  padding:3vh 3vw;overflow:auto;font-size:1.9vh;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.stats h3{font-size:2.6vh;margin-bottom:1.5vh}
.stats table{width:100%;border-collapse:collapse}
.stats th,.stats td{padding:.8vh 1vw;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
.stats th{color:var(--mute)}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats tfoot td{font-weight:700}
.stats .btns{display:flex;gap:1vw;margin-top:2vh}
.stats .btns button{border:1px solid var(--ink);padding:1vh 1.6vw;border-radius:8px}
.stats small{display:block;margin-top:1.5vh;color:var(--mute)}

/* TELEMÓVEL */
.ph{position:fixed;inset:0;display:flex;flex-direction:column;overflow:auto;background:#fff}
.phHead{padding:calc(18px + env(safe-area-inset-top)) 24px 0;font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.phBody{flex:1;display:flex;flex-direction:column;justify-content:safe center;padding:24px 24px calc(28px + env(safe-area-inset-bottom));gap:20px}
.ph h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.ph p{font-size:16px;line-height:1.5;color:var(--mute)}
.btn{display:block;width:100%;background:var(--ink);color:#fff;font-size:17px;font-weight:600;padding:18px;border-radius:14px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.small{font-size:12px!important;color:var(--mute)}
.spinner{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:rot 1s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.phHud{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.phT{height:2px;background:var(--line)}
.phT div{height:100%;background:var(--accent);width:100%}
.pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:14px;min-height:300px;max-height:420px;place-items:center}
.pad button{width:100%;aspect-ratio:1;max-width:110px;border:1.5px solid var(--ink);border-radius:50%;font-size:34px;
  display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:transform .08s,background .15s,color .15s}
.joy{position:relative;height:96px;margin:26px 0 28px;border:1.5px solid var(--ink);border-radius:48px;background:var(--claro);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.joyK{position:absolute;left:50%;top:7px;width:82px;height:82px;margin-left:-41px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-around;font-size:22px;pointer-events:none}
.joy.on .joyK{background:var(--accent)}
.joyGo{min-height:84px;font-size:22px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pad button:active{transform:scale(.94);background:var(--accent);border-color:var(--accent);color:#fff}
.pad button:disabled{opacity:.3}
.pad .mid{font-size:13px;color:var(--mute);text-align:center}
.pad.ok .mid{color:var(--accent)}.pad.ko .mid{color:var(--erro)}
.look{text-align:center;font-size:14px!important}
.gPad{flex:1;display:grid;gap:10px;align-content:center;max-height:440px}
.gPad button{aspect-ratio:1/1;border:1.5px solid var(--ink);border-radius:14px;font-size:20px;font-weight:700;touch-action:manipulation;transition:background .15s,color .15s,opacity .15s}
.gPad button.up{background:var(--accent);border-color:var(--accent);color:#fff}
.gPad button.ok{opacity:.28;border-style:dashed}
.bigN{font-size:120px;font-weight:700;text-align:center;letter-spacing:-.04em;color:var(--accent)}
.voucher{background:var(--claro);border:1.5px solid var(--accent);border-radius:16px;padding:24px;text-align:center}
.voucher .pz{font-size:15px;color:var(--mute)}
.voucher .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;font-weight:700;letter-spacing:2px;margin:12px 0}
.voucher .val{font-size:14px}
.resTop{display:flex;align-items:center;justify-content:center;gap:16px}
.resTop img{height:96px;width:auto;transform-origin:50% 100%}
.resTop .n{font-size:54px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--ink);background:var(--claro);border-radius:99px;padding:4px 10px}
.secT{font-size:13px!important;font-weight:600;color:var(--mute);margin-bottom:8px}
.acts{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.act .ic{flex:none;width:42px;height:42px;padding:9px;border-radius:12px;background:var(--claro);color:var(--accent)}
.act span{flex:1}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;text-align:left;text-decoration:none;color:var(--ink);background:#fff;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act:active{background:var(--claro)}
.act b{display:block;font-size:16px;font-weight:600}
.act small{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.act i{font-style:normal;font-size:22px;color:var(--accent)}
.scoreLine{text-align:center}
.scoreLine .n{font-size:72px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.scoreLine p{margin-top:6px}

/* Validação */
.val input{width:100%;font-size:22px;padding:14px;border-radius:12px;border:1px solid var(--line);text-transform:uppercase;
  font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center}
.res{border-radius:12px;padding:16px;font-size:15px;line-height:1.5;border:1px solid var(--line)}
.res.ok{border-color:var(--ok)}.res.ko{border-color:var(--erro)}.res.warn{border-color:#d9a400}
</style>
</head>

<div id="app"></div>

/* Códigos de voucher: ZO-XXXX-XXXX (data de emissão + aleatório + dígito de controlo).
   Validáveis na loja sem servidor, em ?validar */
const ALPH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const EPOCH = Date.UTC(2026,0,1);
const HOUR = 3600000;
const hourNum = (d = new Date()) => Math.floor((d.getTime() - EPOCH) / HOUR);
function checksum(s){ let t = 0; for (let i = 0; i < s.length; i++) t += (ALPH.indexOf(s[i]) + 1) * (i + 3); return ALPH[t % 32]; }
function makeCode(){
  const h = ((hourNum() % 32768) + 32768) % 32768;
  let b = ALPH[Math.floor(h / 1024)] + ALPH[Math.floor(h / 32) % 32] + ALPH[h % 32];
  const r = new Uint32Array(4); crypto.getRandomValues(r);
  for (const x of r) b += ALPH[x % 32];
  b += checksum(b);
  return "ZO-" + b.slice(0,4) + "-" + b.slice(4);
}
function parseCode(c){
  const s = String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (s.length !== 10 || !s.startsWith("ZO")) return null;
  const b = s.slice(2);
  if ([...b].some(ch => ALPH.indexOf(ch) < 0)) return null;
  if (checksum(b.slice(0,7)) !== b[7]) return null;
  const h = ALPH.indexOf(b[0]) * 1024 + ALPH.indexOf(b[1]) * 32 + ALPH.indexOf(b[2]);
  const issued = new Date(EPOCH + h * HOUR);
  const exp = new Date(issued.getTime() + (CONFIG.validadeHoras + 1) * HOUR); // +1h: emissão arredondada à hora
  return { code: "ZO-" + b.slice(0,4) + "-" + b.slice(4), issued, exp };
}
function scoreLabel(n){
  const t = CONFIG.niveis;
  if (n >= t) return "Visão de águia! 🦅";
  if (n >= Math.ceil(t * .7)) return "Muito boa pontuação!";
  if (n >= Math.ceil(t * .4)) return "Boa pontuação!";
  return "Que tal confirmar com um rastreio?";
}

function toggleStats(){

  const s = getStats(), days = Object.keys(s.dias || {}).sort().reverse();
  const tot = {}; STAT_KEYS.forEach(([k]) => tot[k] = 0);

    <tfoot><tr><td>Total</td>${STAT_KEYS.map(([k]) => `<td>${tot[k]}</td>`).join("")}</tr></tfoot></table>
    <small>Taxa de conclusão (concluídos ÷ ligações): <b>${conv}</b>. Os vouchers usados contam-se na loja (página ?validar ou registo manual).</small>
    <div class="btns"><button id="sCsv">Exportar CSV</button><button class="sec" id="sReset">Repor contadores</button><button class="sec" id="sClose">Fechar (S)</button></div>`;
  document.body.appendChild(el);

  $("#sCsv").onclick = () => {

      .concat(days.slice().reverse().map(d => [d, ...STAT_KEYS.map(([k]) => s.dias[d][k] || 0)].join(";")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + rows.join("\n")], {type:"text/csv"}));
    a.download = "estatisticas-montra.csv"; a.click();
  };
}

  // Demonstração na montra parada: o jogo "joga-se sozinho" para se perceber num relance

  // Melhor pontuação do dia (guardada neste ecrã)
  const RK = () => "zo_montra_recorde_" + J.id; let recMem = 0;   // um recorde por jogo

  function getRecord(){ if (SOLO) return recMem; try { const r = JSON.parse(localStorage.getItem(RK())); return r && r.dia === hoje() ? r.best : 0; } catch { return 0; } }

  function vConnected(){ stage.innerHTML = `<div class="center"><h2>Pronto.</h2><p>Carregue em Começar no telemóvel.</p></div>`;
    mascMode(false); $("#masc").classList.add("top"); masc("polegar", "Olá! Carregue em Começar no telemóvel.", 0); }
  function vCount(n){ stage.innerHTML = `<div class="center"><div class="big">${n}</div></div>`;
    if (n === 3) { mascMode(true); masc("dedo", "Olhos no ecrã!", 2400); } }
  function vPlay(){
    stage.innerHTML = `<div class="play">
      <div class="hud"><span id="hLvl"></span><span class="lives" id="hLives"></span></div>
      <div class="tbar"><div id="tb"></div></div>
      <div class="eWrap" id="eWrap"><div class="eBox" id="eBox"></div></div></div>`;
    dz = []; triInit(); requestAnimationFrame(dzTick);
  }
  // ---- Distrações (logótipos a saltar pelo ecrã)
  let dz = [], dzLast = 0;
  function dzCount(level){
    if (!CONFIG.distracoesNivel || level + 1 < CONFIG.distracoesNivel) return 0;
    const span = Math.max(1, CONFIG.niveis - CONFIG.distracoesNivel);
    return Math.round(1 + (CONFIG.distracoesMax - 1) * (level + 1 - CONFIG.distracoesNivel) / span);

  function dzSync(level){

      const i = dz.length, size = H * (0.06 + Math.random() * 0.07);
      el.style.fontSize = size + "px"; el.style.color = i % 2 ? "#34A7DE" : "#17465A";
      el.innerHTML = CONFIG.logoUrl ? `<img src="${esc(CONFIG.logoUrl)}" alt="">` : esc(CONFIG.loja);
      wrap.appendChild(el);
      const a = Math.random() * Math.PI * 2, v = H * (0.25 + Math.random() * 0.3); // px por segundo

    }
  }
  // ---- Triângulos em queda livre (física com Matter.js), acumulam no fundo nível após nível
  let tri = null;
  const LOGOS = ASSETS.logos.map(src => { const im = new Image(); im.src = src; return im; });
  function triInit(){
    tri = null;
    const wrap = $("#eWrap"); if (!wrap || typeof Matter === "undefined" || !CONFIG.triangulosNivel) return;
    const W = wrap.clientWidth, H = wrap.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
    const cv = document.createElement("canvas"); cv.id = "tri"; cv.width = W * dpr; cv.height = H * dpr; wrap.appendChild(cv);
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    const engine = Matter.Engine.create(); engine.gravity.y = 1.1;
    const st = { isStatic: true }, B = Matter.Bodies;
    Matter.Composite.add(engine.world, [B.rectangle(W / 2, H + 50, W * 2, 100, st), B.rectangle(-50, H / 2, 100, H * 4, st), B.rectangle(W + 50, H / 2, 100, H * 4, st)]);

  function triDrop(level){

    const { W, H, engine } = tri;
    for (let i = 0; i < CONFIG.triangulosPorNivel; i++) {
      const r = H * (0.05 + Math.random() * 0.03);
      const b = Matter.Bodies.polygon(r + Math.random() * (W - 2 * r), -r * (2 + i * 3), 3, r,
        { restitution: .35, friction: .5, angle: Math.random() * Math.PI * 2 });
      b.cor = Math.random() < .5 ? "#34A7DE" : "#17465A"; b.R = r; b.logo = pick(LOGOS);
      Matter.Body.setAngularVelocity(b, (Math.random() - .5) * .2);
      Matter.Composite.add(engine.world, b);
    }
  }
  function triTick(dt){
    if (!tri) return;

    const { ctx, W, H } = tri; ctx.clearRect(0, 0, W, H);
    for (const b of Matter.Composite.allBodies(tri.engine.world)) {
      if (b.isStatic) continue;

        const w = b.R * Math.sqrt(3);
        ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle - Math.PI / 2);
        ctx.drawImage(b.logo, -w / 2, -b.R, w, b.R * 1.5); ctx.restore();
      } else {
        ctx.beginPath(); b.vertices.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y)); ctx.closePath();

  function dzTick(t){

      const w = d.el.offsetWidth, h = d.el.offsetHeight;

      if (d.y < 0) { d.y = 0; d.vy = Math.abs(d.vy); } else if (d.y > H - h) { d.y = Math.max(0, H - h); d.vy = -Math.abs(d.vy); }
      d.el.style.transform = `translate(${d.x.toFixed(1)}px,${d.y.toFixed(1)}px)`;
    }
    requestAnimationFrame(dzTick);
  }
  const VDK = "zo_montra_vales_dia"; let valesMem = 0;
  function valesHoje(){ if (SOLO) return valesMem; try { const r = JSON.parse(localStorage.getItem(VDK)); return r && r.dia === hoje() ? r.n : 0; } catch { return 0; } }
  function contaVale(){ if (SOLO) { valesMem++; return; } try { localStorage.setItem(VDK, JSON.stringify({ dia: hoje(), n: valesHoje() + 1 })); } catch {} }
  function vResult(score, label, reused, recorde, motivo){
    stage.innerHTML = `<div class="center result">
      <div class="score">${pontosTxt(score)}</div>
      ${recorde ? `<p class="rec" style="font-size:3.4vh"><b>Novo recorde de hoje!</b></p>` : ""}
      <p>Veja o seu telemóvel.</p>
      <p style="font-size:2.2vh">Partilhe o momento · <b style="color:var(--ink)">${esc(CONFIG.instagramNome)}</b> no Instagram</p></div>`;
    mascMode(false); $("#masc").classList.add("top");
    const pre = game && game.fala ? game.fala + " " : "";   // o que o jogo quis dizer ao acabar ("Tempo!", "Oh…")
    if (motivo === "pontos") masc("dedo", pre + "Quase! Pode tentar outra vez." + (SOLO ? "" : " Veja o seu telemóvel."), 0);
    else masc("polegar", pre + (recorde ? "Novo recorde de hoje!" : J.total && score >= J.total * .6 ? "Excelente!" : "Boa tentativa!") + (SOLO ? "" : " Veja o seu telemóvel."), 0);
    // convite à app + cashback, depois do resultado (não atrasa nada)
    if (motivo !== "pontos") appT = setTimeout(() => masc("apresenta", "Quer jogar outra vez? Instale a app Zona Óptica. " + CONFIG.cashbackFrase, 0), 4500);
  }

  // ---- Ligação (MQTT por WebSocket)
  const BASE = topicBase(CONFIG.idMontra);
  let player = null, playerVoucher = null, game = null, idleT = null, resultT = null;
  const clients = (SOLO ? [] : BROKERS).map(url => {
    const c = mqtt.connect(url, { clientId: "zo-scr-" + rid(10), reconnectPeriod: 3000, connectTimeout: 10000, clean: true });
    c.on("connect", () => { c.subscribe(BASE + "/in"); c.subscribe(BASE + "/scr"); updStatus();
      setTimeout(() => { if (!ativo) try { c.publish(BASE + "/scr", JSON.stringify({ iid: IID, probe: true })); } catch {} }, 300); });   // "há algum ecrã ativo?"
    ["close","offline","reconnect","error"].forEach(ev => c.on(ev, updStatus));
    c.on("message", (t, m) => { let d; try { d = JSON.parse(m.toString()); } catch { return; } if (t.endsWith("/scr")) onScr(d); else onMsg(c, d); });
    return c;
  });
  function updStatus(){

  }
  const pub = (c, sid, m) => { try { c.publish(BASE + "/out/" + sid, JSON.stringify({ ...m, src: IID })); } catch {} };

  // ---- Um só ecrã ativo por montra. Se a página for aberta noutro separador/computador, esse fica em espera
  //      (dois ecrãs a responder ao mesmo telemóvel davam jogos e pontuações diferentes).
  const IID = rid(12); let ativo = SOLO, claim = 0, ultimoHb = 0; window._zoIid = IID;
  const hb = () => { if (ativo) clients.forEach(c => { try { c.connected && c.publish(BASE + "/scr", JSON.stringify({ iid: IID, claim })); } catch {} }); };
  function ativar(){ ativo = true; claim = Date.now(); const o = $("#espera"); if (o) o.remove(); hb(); }
  function emEspera(){
    if (!ativo && $("#espera")) return;
    ativo = false;
    if (player) send({ t: "bye", reason: "outro" });
    player = null; if (game && !game.ended) stopGame(); game = null; clearTimeout(resultT); vAttract();
    if (!$("#espera")) {
      const o = document.createElement("div"); o.id = "espera";
      o.style.cssText = "position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;padding:5vw";
      o.innerHTML = `<img src="${ASSETS.dedo}" alt="" style="height:26vh"><h2 style="font-size:4.5vh;color:var(--ink)">Esta montra já está aberta noutro ecrã.</h2>
        <p style="font-size:2.4vh;color:var(--mute);max-width:60vw">Só um ecrã pode estar ativo de cada vez. Feche a outra janela, ou use este ecrã como montra.</p>
        <button id="usar" style="font-size:2.6vh;font-weight:600;background:var(--ink);color:#fff;padding:1.8vh 3vw;border-radius:1.4vh">Usar este ecrã</button>`;

  function onScr(d){

  }

    if (!ativo) return;

    if (d.to && d.to !== IID) return;   // mensagem dirigida a outro ecrã

  // ---- Fim de jogo (casca): o jogo chama terminar() quando acaba; daqui para a frente é igual para todos os jogos

    const code = motivo ? null : (playerVoucher || makeCode());
    if (code && !reused) { bump("vouchers"); contaVale(); }
    const p = code ? parseCode(code) : null;
    const recorde = score > 0 && score > getRecord(); if (recorde) setRecord(score);
    send({ t: "end", score, total: J.total || 0, label, code: p ? p.code : null, semVale: motivo, min: minimo, reused, recorde });

      `<p style="font-size:2vh">Modo de teste · no telemóvel apareceria: ${motivo === "pontos" ? `sem vale (mínimo ${minimo} ${J.unidade(minimo)})` : motivo === "esgotado" ? "vales de hoje esgotados" : esc(CONFIG.premio) + ", válido " + CONFIG.validadeHoras + "h"}<br>Clique ou prima Espaço para jogar outra vez</p>`);

  function soloKey(e){
    if (KEYS[e.key]) { e.preventDefault(); if (game && !game.ended) J.tecla(e); }
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); soloStart(); }
  }
  if (SOLO) { stage.addEventListener("click", soloStart); setStatus(true, "Modo de teste"); }

  /* ---- Cobra: apanha óculos e cresce. O jogo corre aqui no ecrã; o telemóvel só envia direções ({t:"in", a}).

  const COBRA = { cols: 24, rows: 14 };
  const OPOSTA = { up: "down", down: "up", left: "right", right: "left" };
  const VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const rand = n => Math.floor(Math.random() * n);
  const naCobra = (cobra, c) => cobra.some(q => q[0] === c[0] && q[1] === c[1]);
  function prepararCanvas(cv, cols, rows){   // ajusta o canvas ao espaço disponível; devolve o contexto e o tamanho de uma casa
    const b = cv.parentElement.getBoundingClientRect();
    const cel = Math.max(2, Math.floor(Math.min((b.width - 8) / cols, (b.height - 8) / rows))), dpr = Math.min(2, devicePixelRatio || 1);

    const y = Math.floor(COBRA.rows / 2);

    cobraComida();

    $("#masc").classList.add("top");   // mascote numa coluna à esquerda do tabuleiro, com o balão por cima: nunca tapa a cobra

    const tb = $("#tb"); tb.style.transition = "none"; tb.style.width = "100%";   // a barra mostra o tempo que falta

  function cobraPassoMs(){   // acelera aos poucos, do passo inicial ao final

  function cobraPasso(){
    if (!game || game.ended || !game.cobra) return;

    if (game.fila.length) game.dir = game.fila.shift();
    const v = VEC[game.dir], c = [game.cobra[0][0] + v[0], game.cobra[0][1] + v[1]];
    const come = c[0] === game.comida[0] && c[1] === game.comida[1];
    const corpo = come ? game.cobra : game.cobra.slice(0, -1);   // a ponta da cauda sai do sítio, a não ser que coma
    if (c[0] < 0 || c[1] < 0 || c[0] >= COBRA.cols || c[1] >= COBRA.rows || naCobra(corpo, c)) { game.fala = "Oh…"; return terminar(); }
    game.cobra.unshift(c);
    if (come) {

    } else game.cobra.pop();

  function cobraVirar(d){   // d vem do telemóvel (rede) ou do teclado: só valem as 4 direções

  // Demonstração no ecrã inicial: uma cobra pequena que joga sozinha
  let cobraDemoT = null;
  function cobraDemo(){
    clearInterval(cobraDemoT);
    const N = 10; let st;
    const novo = () => { st = { cobra: [[4, 5], [3, 5], [2, 5]], dir: "right", comida: [7, 2] }; };
    const prox = d => [st.cobra[0][0] + VEC[d][0], st.cobra[0][1] + VEC[d][1]];
    const dist = d => Math.abs(prox(d)[0] - st.comida[0]) + Math.abs(prox(d)[1] - st.comida[1]);
    novo();
    cobraDemoT = setInterval(() => {
      const cv = $("#cDemo"); if (!cv) return clearInterval(cobraDemoT);
      const corpo = st.cobra.slice(0, -1);
      const ops = DIRS.filter(d => { const c = prox(d); return d !== OPOSTA[st.dir] && c[0] >= 0 && c[1] >= 0 && c[0] < N && c[1] < N && !naCobra(corpo, c); });
      if (!ops.length || st.cobra.length > 14) return novo();
      st.dir = ops.sort((a, b) => dist(a) - dist(b))[0];
      const c = prox(st.dir); st.cobra.unshift(c);
      if (c[0] === st.comida[0] && c[1] === st.comida[1]) { do { st.comida = [rand(N), rand(N)]; } while (naCobra(st.cobra, st.comida)); }
      else st.cobra.pop();
      document.querySelectorAll("#dpad span").forEach(e => e.classList.toggle("on", e.dataset.d === st.dir));
      cobraDesenhar(cv, st, N, N);
    }, 260);
  }
  window._zoCobra = () => game && game.cobra ? { vivo: !game.ended, pts: game.pts, dir: game.fila.length ? game.fila[game.fila.length - 1] : game.dir,
    cab: game.cobra[0], comida: game.comida, corpo: game.cobra, cols: COBRA.cols, rows: COBRA.rows } : null;   // para os testes

  /* ---- Lentes em linha: caem peças de 1, 2 ou 3 blocos; encaixam-se para completar linhas.
     As regras são funções sobre um estado { cols, rows, grade, peca }, usadas pelo jogo e pela demonstração.

  const PECAS = { cols: 8, rows: 12,
    formas: [ [[0,0]], [[0,0],[1,0]], [[0,0],[1,0],[2,0]], [[0,0],[0,1],[1,1]] ],
    cores: ["#34A7DE", "#17465A", "#6f8b97", "#8CCDEE"] };
  const pEstado = (cols, rows) => ({ cols, rows, grade: Array.from({ length: rows }, () => Array(cols).fill(0)), peca: null });
  const pColide = (st, cel, px, py) => cel.some(([x, y]) => { const a = px + x, b = py + y; return a < 0 || a >= st.cols || b >= st.rows || (b >= 0 && !!st.grade[b][a]); });

  }
  window._zoPecasRegras = { estado: pEstado, fundo: pFundo, fixar: pFixar, rodar: pRodarPeca };   // para os testes
  function pecasDesenhar(cv, st){
    const { x, cel } = prepararCanvas(cv, st.cols, st.rows);
    const bloco = (a, b, cor, alfa) => {
      const m = cel * .06, r = [a * cel + m, b * cel + m, cel - 2 * m, cel - 2 * m];
      x.globalAlpha = alfa; x.fillStyle = PECAS.cores[cor - 1]; x.beginPath();

      x.fill();

      x.globalAlpha = 1;

      if (yf !== q.y) q.cel.forEach(([a, b]) => bloco(q.x + a, yf + b, q.cor, .22));   // sombra: onde a peça vai cair
      q.cel.forEach(([a, b]) => bloco(q.x + a, q.y + b, q.cor, 1));
    }
  }
  const pecasVer = () => { const cv = $("#pCv"); if (cv) pecasDesenhar(cv, game); };
  function pecasPassoMs(){
    const k = Math.min(1, (Date.now() - game.inicio) / (CONFIG.pecasAceleraSeg * 1000));
    return Math.round(CONFIG.pecasPassoInicioMs + (CONFIG.pecasPassoFimMs - CONFIG.pecasPassoInicioMs) * k);
  }
  function pecasIniciar(){
    Object.assign(game, pEstado(PECAS.cols, PECAS.rows), { pecas: true, pts: 0, inicio: Date.now(), t: null, fala: "" });
    pNova(game);
    stage.innerHTML = `<div class="play"><div class="hud"><span id="hLvl">${pontosTxt(0)}</span><span></span></div>
      <div class="tbar"><div id="tb"></div></div>
      <div class="cBoard"><div class="cArea"><canvas id="pCv"></canvas></div></div></div>`;
    $("#masc").classList.add("top");
    masc("apresenta", SOLO ? "Encaixe as peças com as setas do teclado." : "Encaixe as peças e complete linhas.", 3800);
    const tb = $("#tb"); tb.style.transition = "none"; tb.style.width = "100%";
    requestAnimationFrame(() => requestAnimationFrame(() => { tb.style.transition = `width ${CONFIG.arcadaLimiteSeg}s linear`; tb.style.width = "0%"; }));

    const g = game;   // limite de tempo com temporizador próprio: vale mesmo que o jogador largue peças sem parar
    g.tLim = setTimeout(() => { if (game === g && !g.ended) { g.fala = "Tempo!"; terminar(); } }, CONFIG.arcadaLimiteSeg * 1000);
  }
  function pecasAssentar(){   // a peça chegou ao fundo: prende-a, conta as linhas e lança a seguinte. Devolve false se o jogo acabou.

  function pecasPasso(){   // gravidade

  function pecasAcao(a){   // a vem do telemóvel (rede) ou do teclado: só valem as 4 direções

  window._zoPecas = () => game && game.pecas ? { vivo: !game.ended, pts: game.pts, cols: game.cols, rows: game.rows,
    grade: game.grade.map(l => l.map(v => v ? 1 : 0)), cel: game.peca.cel, x: game.peca.x, y: game.peca.y } : null;   // para os testes

  /* ---- Jogo dos pares (memória): 12 cartas, 6 pares. As figuras (mascote, logótipos, lettering e fotografias de óculos) só existem aqui no ecrã; o telemóvel recebe apenas

  const MEM = { pares: 6 };

    const a = g.parentElement.getBoundingClientRect(), larg = Math.max(160, Math.floor(Math.min(a.width, a.height * 4 / 3)) - 12);   // 4 colunas x 3 linhas

  }

    const faces = []; for (let i = 0; i < MEM.pares; i++) faces.push(i, i);

    Object.assign(game, { mem: true, faces, est: faces.map(() => 0), abertas: [], pts: 0, tent: 0, bloqueio: null, tLim: null, fala: "" });
    stage.innerHTML = `<div class="play"><div class="hud"><span id="hLvl">${pontosTxt(0)}</span><span id="hTent">Tentativas: 0/${CONFIG.memoriaTentativas}</span></div>
      <div class="tbar"><div id="tb"></div></div>
      <div class="cBoard"><div class="cArea"><div class="mGrid" id="mGrid"></div></div></div></div>`;
    $("#masc").classList.add("top");
    masc("apresenta", SOLO ? "Clique nas cartas e encontre os pares." : "Encontre as imagens iguais!", 3800);
    const tb = $("#tb"); tb.style.transition = "none"; tb.style.width = "100%";
    requestAnimationFrame(() => requestAnimationFrame(() => { tb.style.transition = `width ${CONFIG.memoriaLimiteSeg}s linear`; tb.style.width = "0%"; }));

    game.est[i] = 1; game.abertas.push(i);

        game.bloqueio = setTimeout(() => { g.bloqueio = null; if (game !== g || g.ended) return; g.est[a] = g.est[b] = 0; memVer(); memEstado(); }, 900);

  // Demonstração no ecrã inicial: 6 cartas que se vão virando sozinhas
  let memDemoT = null;
  function memDemo(){
    clearInterval(memDemoT);

    const novo = () => { faces = [0, 3, 4, 0, 3, 4]; for (let i = 5; i > 0; i--) { const j = rand(i + 1); [faces[i], faces[j]] = [faces[j], faces[i]]; } est = faces.map(() => 0); };
    const ver = () => { const g = $("#mDemo"); if (g) g.innerHTML = memCartas(est, faces, false); };
    novo(); ver();
    memDemoT = setInterval(() => {
      if (!$("#mDemo")) return clearInterval(memDemoT);

      if (abertas.length === 2) { const [a, b] = abertas; est[a] = est[b] = faces[a] === faces[b] ? 2 : 0; }
      else if (!fechadas.length) novo();
      else if (abertas.length === 1 && n++ % 3) est[fechadas.find(i => faces[i] === faces[abertas[0]])] = 1;   // na maior parte das vezes acerta
      else est[pick(fechadas)] = 1;

  }
  window._zoMemoria = () => game && game.mem ? { vivo: !game.ended, pts: game.pts, est: game.est.slice(), faces: game.faces.slice() } : null;   // para os testes

  /* ---- Garra dos óculos: máquina de garra com um monte desarrumado de óculos e estojos.
     O telemóvel envia a inclinação do joystick ({t:"in", a:"joy", v} com v entre -1 e 1) e o botão de largar ({t:"in", a:"down"}).
     Não há sorte escondida: a garra balança (sempre um pouco, e mais quando se mexe de repente) e só agarra a peça que estiver
     mais acima por baixo dela, e só pelo meio. Medidas em "posições": a garra anda de 0 a slots-1; a saída dos prémios fica à esquerda. */

  const G_T = { desce: 650, fecha: 250, sobe: 650, larga: 350 };   // tempos da descida, em ms
  function gAssentar(monte){   // cada peça pousa em cima das que já lá estão por baixo dela; fica torta para o lado que não tem apoio

  function gPeca(x, cx, cy, tipo, u, rot){   // tipos 0 a 3: óculos; 4: estojo. Desenhos próprios, sem marcas.
    x.save(); x.translate(cx, cy); if (rot) x.rotate(rot);

  function garraDesenhar(cv, st, agora){

    const dtD = Math.min(.05, Math.max(0, (agora - (st.tDes || agora)) / 1000)); st.tDes = agora;

  function garraLoop(){   // desenho contínuo; as regras andam por temporizadores, não por aqui

        montra: [["apresenta","Olá! Tem boa memória?"],["dedo","Aponte a câmara do telemóvel ao código."],["polegar","É só um minuto. Aceita o desafio?"],["apresenta","Jogue aqui mesmo, com o seu telemóvel."]],
        teste: [["apresenta","Olá! Vamos encontrar os pares?"],["dedo","Clique no ecrã ou prima Espaço para começar."]]
      },
      minimo: () => CONFIG.memoriaMinimo,
      atrair: () => `<h1>Encontre os pares!</h1>
        <div class="demo"><div class="mMini" id="mDemo"></div></div>`,
      aoAtrair: () => memDemo(),
      iniciar: () => memIniciar(),
      mensagem(d){ if (d.t === "in") memTocar(d.a); },
      estado(){ if (game.mem) memEstado(); },
      tecla(){},   // no modo ?teste joga-se com o rato
      parar(){ clearTimeout(game.tLim); clearTimeout(game.bloqueio); },
      pontos: () => game.pts || 0
    },
    garra: {
      id: "garra", titulo: "Garra dos óculos", total: null, unidade: n => n === 1 ? "peça" : "peças",
      ajudaTeste: "Setas do teclado: ← → movem a garra, ↓ larga",
      falas: {
        montra: [["apresenta","Olá! Quantas peças consegue apanhar?"],["dedo","Aponte a câmara do telemóvel ao código."],["polegar","É só um minuto. Aceita o desafio?"],["apresenta","Jogue aqui mesmo, com o seu telemóvel."]],
        teste: [["apresenta","Olá! Vamos apanhar óculos?"],["dedo","Clique no ecrã ou prima Espaço para começar."]]
      },
      minimo: () => CONFIG.garraMinimo,
      atrair: () => `<h1>Garra dos óculos</h1>
        <div class="demo gDemoBox"><canvas id="gDemo"></canvas></div>
        <div class="dpad" id="dpad"><span data-d="left">←</span><span data-d="down">↓</span><span data-d="right">→</span></div>`,
      aoAtrair: () => garraDemo(),
      iniciar: () => garraIniciar(),
      mensagem(d){ if (d.t === "in") garraAcao(d.a, d.v); },
      estado(){ if (game.garra) send({ t: "jogo", pts: game.pts }); },
      tecla(e){ const k = KEYS[e.key]; if (k === "down") { if (!e.repeat) garraAcao("down"); } else if (k === "left" || k === "right") garraAcao("joy", k === "left" ? -1 : 1); },
      parar(){ clearTimeout(game.tLim); clearTimeout(game.tC); clearTimeout(game.tR); clearInterval(game.tk); cancelAnimationFrame(game.raf); },
      pontos: () => game.pts || 0
    }
  };

  /* ---- Menu de jogos: quem escolhe é a equipa, nunca o cliente. A escolha fica guardada neste browser.
     Ordem no arranque: escolha guardada, depois ?jogo=<id> (que fica guardado), depois o menu. Tecla M para trocar. */
  const JK = "zo_montra_jogo";
  const existe = id => jogoValido(id) && !!JOGOS[id];
  function jogoGuardado(){ try { const v = localStorage.getItem(JK); return existe(v) ? v : null; } catch { return null; } }
  function fecharMenu(){ menuAberto = false; const m = $("#menu"); if (m) m.remove(); game = null; clearTimeout(resultT); vAttract(); }
  function usarJogo(id){
    if (!existe(id)) return;
    if (!SOLO) try { localStorage.setItem(JK, id); } catch {}   // sem memória no browser: vale só para esta sessão. O modo ?teste nunca guarda.
    J = JOGOS[id]; window._zoJogo = id;
    fecharMenu();
  }
  function abrirMenu(){
    if (menuAberto || (game && !game.ended)) return;   // nunca a meio de um jogo
    if ($("#espera")) return;                            // nem num ecrã em espera: ficava escondido atrás do aviso
    if (player) { send({ t: "bye", reason: "outro" }); player = null; clearTimeout(idleT); }
    menuAberto = true;
    const m = document.createElement("div"); m.id = "menu"; m.className = "menu";
    m.innerHTML = `<h2>Que jogo fica nesta montra?</h2><div class="lista">${Object.keys(JOGOS).filter(existe).map(id =>
      `<button class="mJogo" data-jogo="${id}">${JOGOS[id].atrair(0)}<b>${esc(CATALOGO[id].nome)}</b><span>${esc(CATALOGO[id].descricao)}</span><em>${J && J.id === id ? "Em uso" : ""}</em></button>`).join("")}</div>
      <p>A escolha fica guardada neste computador. Para trocar, prima M.</p>`;
    stage.innerHTML = "";   // tira a demonstração do ecrã de espera: as do menu usam os mesmos identificadores
    document.body.appendChild(m);
    Object.keys(JOGOS).filter(existe).forEach(id => JOGOS[id].aoAtrair());   // cada cartão mostra o jogo a jogar-se sozinho
    m.querySelectorAll(".mJogo").forEach(b => { b.onclick = () => usarJogo(b.dataset.jogo); });
    (m.querySelector(`.mJogo[data-jogo="${J ? J.id : ""}"]`) || m.querySelector(".mJogo")).focus();
  }
  function teclaMenu(e){   // setas mudam o foco; Enter e Espaço carregam no botão em foco; Esc ou M fecham se já houver jogo escolhido
    const bs = [...document.querySelectorAll("#menu .mJogo")], i = bs.indexOf(document.activeElement);
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); bs[(Math.max(i, 0) - 1 + bs.length) % bs.length].focus(); }
    else if ((e.key === "Escape" || e.key === "m" || e.key === "M") && J) fecharMenu();
    else if (e.key === "Enter" && i < 0 && bs[0]) bs[0].click();
  }
  const pedido = existe(params.get("jogo")) ? params.get("jogo") : null;
  const inicial = SOLO ? (pedido || jogoGuardado()) : (jogoGuardado() || pedido);   // no modo ?teste manda o endereço
  if (inicial) usarJogo(inicial); else abrirMenu();
}

/* =====================================================================
   MODO TELEMÓVEL (comando)
   ===================================================================== */
function initPhone(){
  if (!libsOk()) return;
  const hostId = params.get("m");
  const VK = "zo_voucher";
  const getV = () => { try { const v = JSON.parse(localStorage.getItem(VK)); return v && new Date(v.exp) > new Date() ? v : null; } catch { return null; } };
  const BASE = topicBase(hostId || "");
  const sid = rid(16); window._zoSid = sid;
  let jogoTel = null;   // jogo que está na montra (vem na mensagem "ready" e só é usado depois de confirmado no CATALOGO)
  const TXT = () => CATALOGO[jogoTel].tel;
  let client = null, state = "init", connT = null, total = CONFIG.niveis, lastRx = 0, helloSent = false, host = null, curN = 0;
  const send = m => { try { client && client.connected && client.publish(BASE + "/in", JSON.stringify({ ...m, sid, ...(host ? { to: host } : {}) })); } catch {} };
  const LIVE = ["ready","count","play"];
  // App: depois da 1.ª jogada, só volta a jogar quem indicar o código de cliente (fica guardado apenas neste telemóvel)
  const PK = "zo_jogou", CK = "zo_cliente";
  const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const ua = navigator.userAgent, isIos = /iPhone|iPad|iPod/i.test(ua), isAndroid = /Android/i.test(ua);
  // Um só botão "Instalar a app": abre diretamente a loja certa para este telemóvel
  const lojaApp = () => {
    const bt = (url, txt, sec) => `<a class="btn${sec ? " sec" : ""}" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(url)}">${txt}</a>`;
    if (isIos) return bt(CONFIG.appIos, "Instalar a app");
    if (isAndroid) return bt(CONFIG.appAndroid, "Instalar a app");
    return bt(CONFIG.appIos, "Instalar a app (iPhone)") + bt(CONFIG.appAndroid, "Instalar a app (Android)", true);
  };
  const PRIV = `<details class="small"><summary>Privacidade</summary><p class="small" style="margin-top:6px">Este jogo não pede nem recolhe dados pessoais. O vale e, se o indicar, o seu código de cliente ficam guardados apenas neste telemóvel. O código de cliente só é registado pela loja quando utilizar o vale, para confirmar a sua ficha de cliente. Responsável: ${esc(CONFIG.loja)}.</p></details>`;
  function vGate(){
    view("gate", `<img class="pMasc hop" src="${ASSETS.dedo}" alt="" style="height:120px">
      <div><h1>Quer jogar outra vez?</h1>
      <p style="margin-top:8px">Instale a app Zona Óptica e crie a sua ficha de cliente. ${esc(CONFIG.cashbackFrase)}</p></div>
      ${lojaApp()}
      <div class="val"><p style="margin-bottom:6px">Já tem a app? Indique o seu código de cliente:</p>
        <input id="cli" inputmode="text" autocomplete="off" placeholder="Código de cliente" maxlength="20"></div>
      <button class="btn sec" id="goCli">Jogar</button>
      <p class="small" id="cliErr">O código fica guardado só neste telemóvel e é confirmado na loja quando usar o vale.</p>${PRIV}${existingVoucherBtn()}`);
    bindShowVoucher();
    $("#goCli").onclick = () => {
      const c = $("#cli").value.trim().toUpperCase();
      if (!/^[A-Z0-9][A-Z0-9 .\-]{2,19}$/.test(c)) { const e = $("#cliErr"); e.textContent = "Indique o código de cliente que aparece na app."; e.style.color = "var(--erro)"; return; }
      lsSet(CK, c); connect();
    };
  }

  app.innerHTML = `<div class="ph"><div class="phHead">${esc(CONFIG.loja)}</div><div class="phBody" id="pb"></div></div>`;
  const pb = $("#pb");
  const view = (s, html) => { state = s; pb.innerHTML = html; };

  function vError(msg){
    view("error", `<div><h1>Ups.</h1><p style="margin-top:8px">${esc(msg)}</p></div>
      <button class="btn" id="retry">Tentar novamente</button>${existingVoucherBtn()}`);
    $("#retry").onclick = () => location.reload();
    bindShowVoucher();
  }
  function existingVoucherBtn(){ return getV() ? `<button class="btn sec" id="showV">Ver o meu voucher</button>` : ""; }
  function bindShowVoucher(){ const b = $("#showV"); if (b) b.onclick = () => vVoucherOnly(); }
  function vVoucherOnly(){
    const v = getV(); if (!v) return;
    view("voucher", voucherHtml(v.code, v.exp, v.premio) + `<p class="small">${esc(AVISO)}</p>`);
  }
  function voucherHtml(code, exp, premio){
    return `<div class="voucher"><div class="pz">${esc(premio || CONFIG.premio)}</div>
      <div class="code">${esc(code)}</div>
      <div class="val">Válido até ${fmtDT(new Date(exp))}${lsGet(CK) ? `<br>Cliente: <b>${esc(lsGet(CK))}</b>` : ""}</div></div>
      <p class="small" style="text-align:center;margin-top:8px">Mostre este ecrã na loja. ${esc(CONFIG.condicoes)}</p>`;
  }

  function connect(){
    view("connecting", `<div class="spinner"></div><p style="text-align:center">A ligar…</p>`);
    tryBroker(0);
    setInterval(() => {
      if (LIVE.includes(state)) {
        send({ t: "ping" });
        if (Date.now() - lastRx > 20000) vError("A ligação à montra terminou.");
      }
    }, 3000);
    addEventListener("pagehide", () => send({ t: "bye" }));
  }
  function tryBroker(i){
    if (i >= BROKERS.length) return vError("Não foi possível ligar ao servidor do jogo. Confirme que tem internet e tente novamente.");
    let ok = false;
    const c = mqtt.connect(BROKERS[i], { clientId: "zo-ph-" + sid, reconnectPeriod: 2000, connectTimeout: 7000, clean: true,
      will: { topic: BASE + "/in", payload: JSON.stringify({ sid, t: "bye" }), qos: 0, retain: false } });
    const failT = setTimeout(() => { if (!ok) { c.end(true); tryBroker(i + 1); } }, 8000);
    c.on("connect", () => {
      if (ok) return; ok = true; clearTimeout(failT); client = c;
      c.subscribe(BASE + "/out/" + sid, () => {
        if (helloSent) return; helloSent = true;
        const v = getV(); send({ t: "hello", voucher: v ? v.code : null, app: !!lsGet(CK), k: params.get("k") || "" });
        connT = setTimeout(() => { if (state === "connecting") vError("A montra não respondeu. Pode estar desligada neste momento."); }, 8000);
      });
    });
    c.on("message", (t, m) => { let d; try { d = JSON.parse(m.toString()); } catch { return; } lastRx = Date.now(); onData(d); });
  }

  function onData(d){
    if (!d || typeof d !== "object") return;
    // O telemóvel liga-se ao primeiro ecrã que responde e ignora qualquer outro
    if (typeof d.src === "string") { if (!host) host = d.src; else if (d.src !== host) return; }
    // Segurança: nada do que chega pela rede é usado como HTML; os números são validados
    const num = (v, max) => Math.max(0, Math.min(max, parseInt(v, 10) || 0));
    d = { ...d, est: Array.isArray(d.est) ? d.est.slice(0, 36).map(v => v === 1 || v === 2 ? v : 0) : [],   // estado das cartas (memória): só 0, 1 ou 2
          pts: num(d.pts, 999), score: num(d.score, 999), total: num(d.total, 99), n: num(d.n, 99), lives: num(d.lives, 9), vidas: num(d.vidas, 9), ms: num(d.ms, 60000),
          reused: !!d.reused, recorde: !!d.recorde, ok: !!d.ok, timeout: !!d.timeout };
    if (d.t === "end") {
      d.semVale = d.semVale === "pontos" || d.semVale === "esgotado" ? d.semVale : ""; d.min = num(d.min, 99);
      if (!d.semVale) { const pc = parseCode(d.code); if (!pc) return; d.code = pc.code; d.exp = pc.exp.toISOString(); d.premio = CONFIG.premio; }
    }
    clearTimeout(connT);
    if (d.t === "pong") return;
    if (!jogoTel && ["count", "round", "fb", "jogo", "end"].includes(d.t)) return;   // mensagens de jogo só depois de um "ready" válido
    if (d.t === "bye") { if (LIVE.includes(state)) vError(d.reason === "outro" ? "A montra foi reiniciada. Leia o código outra vez." : "A sessão terminou por inatividade."); return; }
    if (d.t === "ready") {
      if (!jogoValido(d.jogo)) { vError("Esta página está desatualizada. Leia o código da montra outra vez."); try { client.end(); } catch {} return; }
      jogoTel = d.jogo; window._zoJogoTel = jogoTel;
      total = d.total || total;
      view("ready", `<img class="pMasc hop" src="${ASSETS.dedo}" alt=""><div><h1>Olá! Olhe para a montra.</h1>
          <p style="margin-top:8px">${esc(TXT().instrucao(d.vidas || CONFIG.vidas))}</p></div>
        <button class="btn" id="go">Começar</button>
        <p class="small">${esc(AVISO)}</p>${PRIV}`);
      $("#go").onclick = () => { $("#go").disabled = true; send({ t: "start" }); };
    } else if (d.t === "expirado") {
      view("error", `<img class="pMasc" src="${ASSETS.dedo}" alt=""><div><h1>Este código já expirou.</h1><p style="margin-top:8px">Por segurança, o código da montra muda a cada minuto. Aponte a câmara à montra e leia-o outra vez.</p></div>${existingVoucherBtn()}`);
      bindShowVoucher(); try { client.end(); } catch {}
    } else if (d.t === "busy") {
      view("busy", `<img class="pMasc" src="${ASSETS.apresenta}" alt=""><div><h1>Alguém está a jogar.</h1><p style="margin-top:8px">Tente daqui a um minuto.</p></div>
        <button class="btn" id="retry">Tentar novamente</button>${existingVoucherBtn()}`);
      $("#retry").onclick = () => location.reload(); bindShowVoucher();
    } else if (d.t === "count") {
      view("count", `<div class="bigN">${d.n}</div><p class="look">Olhe para a montra</p>`);
    } else if (d.t === "jogo") {   // jogos de arcada: comando (direções ou cartas) e pontos
      const cmd = TXT().comando;
      if (!["direcoes", "cartas", "joystick"].includes(cmd) || !LIVE.includes(state)) return;
      if (cmd === "cartas") {
        if (!d.est.length) return;
        if (state !== "play" || pb.querySelectorAll("#gpad button").length !== d.est.length) renderCartas(d.est.length);
        pb.querySelectorAll("#gpad button").forEach((b, i) => { b.className = d.est[i] === 1 ? "up" : d.est[i] === 2 ? "ok" : ""; });
      } else if (state !== "play") { if (cmd === "joystick") renderJoystick(); else renderDirecoes(); }
      $("#pPts").textContent = d.pts;
    } else if (d.t === "round") {
      if (TXT().comando !== "respostas" || !LIVE.includes(state)) return;
      curN = d.n;
      if (state !== "play") renderPad();
      $("#pLvl").textContent = `${d.n}/${d.total}`;
      $("#pLives").innerHTML = hearts(d.lives);
      $("#pad").className = "pad"; pMid(d.n === 1 ? "dedo" : "apresenta", "");
      const t = $("#pT"); t.style.transition = "none"; t.style.width = "100%";
      requestAnimationFrame(() => requestAnimationFrame(() => { t.style.transition = `width ${d.ms}ms linear`; t.style.width = "0%"; }));
      setPad(true);
    } else if (d.t === "fb") {
      if (TXT().comando !== "respostas" || state !== "play") return;
      setPad(false);
      $("#pad").className = "pad " + (d.ok ? "ok" : "ko");
      pMid(d.ok ? "polegar" : "dedo", d.ok ? "Certo" : (d.timeout ? "Tempo" : "Errado"), true);
      $("#pLives").innerHTML = hearts(d.lives);
      if (!d.ok && navigator.vibrate) navigator.vibrate(120);
    } else if (d.t === "end") {
      // Sem vale (pontuação baixa ou vales do dia esgotados): não conta como jogada, pode tentar outra vez sem a app
      if (!d.semVale) { try { localStorage.setItem(VK, JSON.stringify({ code: d.code, exp: d.exp, premio: d.premio })); } catch {} lsSet(PK, new Date().toISOString()); }
      const ico = d => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
      const IC = {
        consulta: ico('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/>'),
        app: ico('<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 7.5v7M9 12l3 3 3-3M10.5 18.5h3"/>'),
        partilhar: ico('<circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/>'),
        seguir: ico('<circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.6-3.6 3.2-5.5 6.5-5.5 1.3 0 2.5.3 3.5.9M18 14v6M15 17h6"/>'),
      };
      const row = (icon, attrs, tit, sub, tag = "a") => `<${tag} class="act" ${attrs}>${IC[icon]}<span><b>${tit}</b><small>${sub}</small></span><i>›</i></${tag}>`;
      const ext = url => `target="_blank" rel="noopener" href="${esc(url)}"`;
      const appUrl = isIos ? CONFIG.appIos : CONFIG.appAndroid;
      view("end", `<div class="resTop"><img class="hop" src="${ASSETS[d.semVale === "pontos" ? "dedo" : "polegar"]}" alt="">
          <div><div class="n">${esc(TXT().pontuacao(d.score, d.total))}</div>${TXT().unidade(d.score) ? `<p class="secT" style="margin:4px 0 0">${esc(TXT().unidade(d.score))}</p>` : ""}${d.recorde ? `<span class="tag">Novo recorde de hoje</span>` : ""}</div></div>
        ${d.semVale === "pontos" ? `<div class="voucher" style="background:#fff"><b style="font-size:18px">Quase!</b><p style="margin-top:6px">${esc(TXT().quase(d.min))}</p></div>`
          : d.semVale === "esgotado" ? `<div class="voucher" style="background:#fff"><b style="font-size:18px">Boa pontuação!</b><p style="margin-top:6px">As surpresas de hoje já esgotaram. Volte amanhã e jogue outra vez.</p></div>`
          : `<div><p class="secT">${d.reused ? "O seu vale (ainda ativo)" : "Ganhou um vale"}</p>
        ${voucherHtml(d.code, d.exp, d.premio)}</div>`}
        <div><p class="secT">E agora?</p><div class="acts">
          ${row("consulta", ext(CONFIG.consultaUrl), "Marcar exame visual", "Escolha a loja mais perto de si")}
          ${lsGet(CK) ? "" : row("app", ext(appUrl), "Instalar a app Zona Óptica", d.semVale ? "Acumule Cashback nas suas compras" : "Para voltar a jogar e acumular Cashback")}
          ${row("partilhar", 'id="share" type="button"', "Partilhar o resultado", "Desafie os seus amigos", "button")}
          ${row("seguir", ext(CONFIG.instagramUrl), "Seguir " + esc(CONFIG.instagramNome), "Novidades no Instagram")}
        </div></div>`);
      prepShare(d.score, d.total);
      setTimeout(() => { try { client.end(); } catch {} }, 800);
    }
  }

  function renderCartas(n){   // comando da memória: uma grelha de botões numerados, um por carta (as figuras só se veem na montra)
    view("play", `<div class="phHud"><span>${esc(TXT().unidade(2).replace(/^./, c => c.toUpperCase()))}</span><b id="pPts">0</b></div>
      <div class="gPad" id="gpad" style="grid-template-columns:repeat(${Number(TXT().colunas) || 4},1fr)">${Array.from({ length: n }, (_, i) => `<button data-i="${i}" aria-label="Carta ${i + 1}">${i + 1}</button>`).join("")}</div>
      <p class="look">${esc(TXT().olhar)}</p>`);
    pb.querySelectorAll("#gpad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); send({ t: "in", a: Number(b.dataset.i) }); }));
  }
  function renderDirecoes(){   // comando dos jogos de arcada: 4 setas sempre ativas
    view("play", `<div class="phHud"><span>${esc(TXT().unidade(2).replace(/^./, c => c.toUpperCase()))}</span><b id="pPts">0</b></div>
      <div class="pad" id="pad">
        <span></span><button data-d="up" aria-label="${TXT().cima ? "Rodar" : "Cima"}">${TXT().cima || "↑"}</button><span></span>
        <button data-d="left" aria-label="Esquerda">←</button><div class="mid" id="mid"><img id="pm" src="${ASSETS.apresenta}" alt=""></div><button data-d="right" aria-label="Direita">→</button>
        <span></span><button data-d="down" aria-label="Baixo">↓</button><span></span>
      </div>
      <p class="look">${esc(TXT().olhar)}</p>`);
    // "pointerdown" e não "click": o toque segue no instante em que o dedo pousa (num jogo rápido cada décima conta)
    pb.querySelectorAll("#pad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); send({ t: "in", a: b.dataset.d }); }));
  }
  let joyT = null;   // garra: reenvio da inclinação do joystick enquanto o dedo lá está (se a ligação falhar, a montra para a garra sozinha)
  function renderJoystick(){   // comando da garra: um manípulo que se arrasta para a esquerda ou para a direita, e um botão de largar
    view("play", `<div class="phHud"><span>${esc(TXT().unidade(2).replace(/^./, c => c.toUpperCase()))}</span><b id="pPts">0</b></div>
      <div class="joy" id="joy" aria-label="Joystick: arraste para a esquerda ou para a direita"><div class="joyK" id="joyK"><span>←</span><span>→</span></div></div>
      <button class="btn joyGo" id="joyGo">Largar a garra</button>
      <p class="look">${esc(TXT().olhar)}</p>`);
    const tr = $("#joy"), k = $("#joyK"); let v = 0, enviado = 0, ativo = false, dedo = null;   // dedo: só o dedo que pegou no manípulo o comanda
    clearInterval(joyT);
    const enviar = () => { enviado = v; send({ t: "in", a: "joy", v }); };
    const por = x => {   // x: posição do dedo no ecrã. Quanto mais longe do centro, mais depressa anda a garra.
      const r = tr.getBoundingClientRect(), curso = Math.max(1, (r.width - k.offsetWidth) / 2);
      let n = Math.max(-1, Math.min(1, (x - r.left - r.width / 2) / curso)); if (Math.abs(n) < .1) n = 0;
      v = Math.round(n * 20) / 20; k.style.transform = `translateX(${n * curso}px)`;
      if (v !== enviado && (v === 0 || Math.abs(v) === 1 || Math.abs(v - enviado) >= .1)) enviar();
    };
    const soltar = e => { if (!ativo || (e && e.pointerId !== dedo)) return; ativo = false; dedo = null; v = 0; k.style.transform = ""; tr.classList.remove("on"); enviar(); };
    tr.addEventListener("pointerdown", e => { e.preventDefault(); if (ativo) return; ativo = true; dedo = e.pointerId; tr.classList.add("on"); try { tr.setPointerCapture(e.pointerId); } catch {} por(e.clientX); });
    tr.addEventListener("pointermove", e => { if (ativo && e.pointerId === dedo) por(e.clientX); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => tr.addEventListener(ev, soltar));
    tr.addEventListener("contextmenu", e => e.preventDefault());
    joyT = setInterval(() => { if (!tr.isConnected || state !== "play") return clearInterval(joyT); if (ativo && v !== 0) enviar(); }, 200);
    $("#joyGo").addEventListener("pointerdown", e => { e.preventDefault(); send({ t: "in", a: "down" }); });
  }
  function renderPad(){
    view("play", `<div class="phHud"><span id="pLvl"></span><span class="lives" id="pLives"></span></div>
      <div class="phT"><div id="pT"></div></div>
      <div class="pad" id="pad">
        <span></span><button data-d="up" aria-label="Cima">↑</button><span></span>
        <button data-d="left" aria-label="Esquerda">←</button><div class="mid" id="mid"><img id="pm" src="${ASSETS.apresenta}" alt=""><span id="pmT"></span></div><button data-d="right" aria-label="Direita">→</button>
        <span></span><button data-d="down" aria-label="Baixo">↓</button><span></span>
      </div>
      <p class="look">${esc(TXT().olhar)}</p>`);
    pb.querySelectorAll("#pad button").forEach(b => b.addEventListener("click", () => {
      if (b.disabled) return; setPad(false); send({ t: "ans", d: b.dataset.d, n: curN });
    }));
  }
  // ---- Partilha: imagem com a pontuação (sem revelar o prémio), pronta para Instagram, WhatsApp, etc.
  let shareFile = null, shareTxt = "";
  function prepShare(score, tot){
    shareTxt = TXT().partilha(score, tot);
    const bt = $("#share"); if (bt) bt.onclick = doShare;
    const im = new Image();
    im.onload = () => { try {
      const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
      const x = c.getContext("2d"), F = '"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
      x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
      x.fillStyle = "#EAF6FC"; x.beginPath(); x.moveTo(0, H); x.lineTo(W, H); x.lineTo(W, H - 360); x.lineTo(0, H - 220); x.fill();
      x.fillStyle = "#17465A"; x.font = `600 44px ${F}`; x.textAlign = "left"; x.fillText(CONFIG.loja, 70, 110);
      const mh = 470, mw = mh * im.naturalWidth / im.naturalHeight; x.drawImage(im, (W - mw) / 2, 170, mw, mh);
      x.textAlign = "center";
      x.fillStyle = "#34A7DE"; x.font = `700 300px ${F}`; x.fillText(TXT().pontuacao(score, tot), W / 2, 930);
      x.fillStyle = "#17465A"; x.font = `600 50px ${F}`; x.fillText(TXT().legenda, W / 2, 1020);
      x.font = `700 58px ${F}`; x.fillText("Consegue fazer melhor?", W / 2, 1190);
      x.fillStyle = "#34A7DE"; x.font = `600 46px ${F}`; x.fillText(CONFIG.instagramNome, W / 2, 1270);
      window._zoCard = c;
      c.toBlob(b => { if (b) try { shareFile = new File([b], TXT().ficheiro, { type: "image/png" }); } catch {} }, "image/png");
    } catch {} };
    im.src = ASSETS.polegar;
  }
  async function doShare(){
    try {
      if (shareFile && navigator.canShare && navigator.canShare({ files: [shareFile] })) return await navigator.share({ files: [shareFile], text: shareTxt });
      if (navigator.share) return await navigator.share({ text: shareTxt, url: CONFIG.instagramUrl });
    } catch (e) { if (e && e.name === "AbortError") return; }
    window.open(CONFIG.instagramUrl, "_blank", "noopener");   // sem partilha nativa: abre o Instagram
  }
  function pMid(pose, txt, hop){
    const im = $("#pm"); if (!im) return;
    im.src = ASSETS[pose]; $("#pmT").textContent = txt;
    if (hop) { im.classList.remove("hop"); void im.offsetWidth; im.classList.add("hop"); }
  }
  function setPad(on){ pb.querySelectorAll("#pad button").forEach(b => b.disabled = !on); }

  if (!hostId) return vError("Link inválido.");
  if (lsGet(PK) && !lsGet(CK)) vGate(); else connect();
}

/* =====================================================================
   MODO VALIDAÇÃO (balcão da loja) — abrir com ?validar
   ===================================================================== */
function initValidate(){
  // PIN simples para afastar curiosos (pede-se uma vez por dispositivo)
  const PINK = "zo_pin_ok";
  let pinOk = !CONFIG.pinValidacao; try { pinOk = pinOk || localStorage.getItem(PINK) === CONFIG.pinValidacao; } catch {}
  if (!pinOk) {
    app.innerHTML = `<div class="ph val"><div class="phHead">${esc(CONFIG.loja)} · Validação de vales</div>
      <div class="phBody" style="max-width:420px;margin:0 auto;width:100%"><div><h1>Área da loja</h1><p style="margin-top:8px">Introduza o PIN.</p></div>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="btn" id="pinGo">Entrar</button><p class="small" id="pinErr"></p></div></div>`;
    const go = () => { if ($("#pin").value === CONFIG.pinValidacao) { try { localStorage.setItem(PINK, CONFIG.pinValidacao); } catch {} initValidate2(); } else { $("#pinErr").textContent = "PIN incorreto."; $("#pinErr").style.color = "var(--erro)"; } };
    $("#pinGo").onclick = go; $("#pin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    return;
  }
  initValidate2();
}
function initValidate2(){
  const UK = "zo_vouchers_usados", LK = "zo_loja";
  const used = () => { try { return JSON.parse(localStorage.getItem(UK)) || {}; } catch { return {}; } };
  const topic = code => "zonaoptica/vales/v1/" + code;
  let loja = ""; try { loja = localStorage.getItem(LK) || ""; } catch {}
  app.innerHTML = `<div class="ph val"><div class="phHead">${esc(CONFIG.loja)} · Validação de vales</div>
    <div class="phBody" style="max-width:560px;margin:0 auto;width:100%;justify-content:flex-start">
      <div class="card"><p style="margin-bottom:6px">Loja</p><input id="loja" placeholder="Nome da loja" value="${esc(loja)}" style="text-transform:none;letter-spacing:0;font-family:inherit;font-size:18px">
        <p style="margin:14px 0 6px">Código do vale</p><input id="code" placeholder="ZO-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
        <p style="margin:14px 0 6px">Código de cliente (ficha obrigatória)</p><input id="cli" placeholder="Código de cliente" autocomplete="off" style="letter-spacing:0"></div>
      <button class="btn" id="chk">Validar</button>
      <div id="out"></div>
      <p class="small" id="reg">Registo partilhado entre lojas: a ligar…</p>
      <p class="small">${esc(CONFIG.premio)} · ${esc(CONFIG.condicoes)} O vale só é aceite com ficha de cliente.</p>
      <button class="btn sec" id="csv" style="font-size:14px;padding:12px">Exportar vales usados neste dispositivo (CSV)</button>
    </div></div>`;
  const out = $("#out");
  $("#loja").addEventListener("change", e => { loja = e.target.value.trim(); try { localStorage.setItem(LK, loja); } catch {} });

  // Registo partilhado: cada vale usado fica gravado em vários servidores, visível em todas as lojas
  const pend = {};   // topic -> callback
  const clients = (typeof mqtt === "undefined" ? [] : REG_BROKERS).map(url => {
    const c = mqtt.connect(url, { clientId: "zo-val-" + rid(10), reconnectPeriod: 3000, connectTimeout: 8000, clean: true });
    ["connect","close","offline"].forEach(ev => c.on(ev, updReg));
    c.on("error", () => {});
    c.on("message", (t, m) => { if (pend[t] && m.length) { let d = {}; try { d = JSON.parse(m.toString()); } catch {} pend[t](d); } });
    return c;
  });
  const online = () => clients.filter(c => c.connected);
  function updReg(){
    const n = online().length, el = $("#reg"); if (!el) return;
    el.textContent = n ? `Registo partilhado entre lojas: ligado (${n}/${clients.length})` : "⚠ Registo partilhado sem ligação — só é possível verificar os vales usados neste dispositivo.";
    el.style.color = n ? "" : "var(--erro)";
  }
  function procurar(code){   // devolve o registo de utilização, se existir em algum servidor
    return new Promise(res => {
      const t = topic(code), cs = online(); if (!cs.length) return res({ semLigacao: true });
      let feito = false;
      const fim = r => { if (feito) return; feito = true; delete pend[t]; cs.forEach(c => { try { c.unsubscribe(t); } catch {} }); res(r); };
      pend[t] = d => fim({ usado: d });
      cs.forEach(c => c.subscribe(t, { qos: 1 }));
      setTimeout(() => fim({}), 2500);
    });
  }
  function gravar(code, reg){
    return new Promise(res => {
      const cs = online(); if (!cs.length) return res(0);
      let ok = 0, n = 0;
      cs.forEach(c => c.publish(topic(code), JSON.stringify(reg), { qos: 1, retain: true }, err => { n++; if (!err) ok++; if (n === cs.length) res(ok); }));
      setTimeout(() => res(ok), 4000);
    });
  }
  const usadoHtml = (code, u) => `<div class="res warn"><b>${code}</b><br>⚠ JÁ FOI USADO em ${fmtDT(new Date(u.t))}${u.loja ? " · " + esc(u.loja) : ""}. Não aceitar.</div>`;

  async function check(){
    const p = parseCode($("#code").value);
    if (!p) { out.innerHTML = `<div class="res ko"><b>Código inválido.</b> Confirme se foi bem escrito.</div>`; return; }
    if (p.exp < new Date()) { out.innerHTML = `<div class="res ko"><b>${p.code}</b><br>Expirado em ${fmtDT(p.exp)} (emitido a ${fmtDT(p.issued)}).</div>`; return; }
    const local = used()[p.code];
    if (local) { out.innerHTML = usadoHtml(p.code, typeof local === "string" ? { t: local } : local); return; }
    out.innerHTML = `<div class="spinner"></div>`;
    const r = await procurar(p.code);
    if (r.usado) { out.innerHTML = usadoHtml(p.code, r.usado); return; }
    out.innerHTML = `<div class="res ok"><b>✓ Válido — ${esc(CONFIG.premio)}</b><br>${p.code}<br>Emitido a ${fmtDT(p.issued)} · válido até ${fmtDT(p.exp)}<br>${esc(CONFIG.condicoes)}</div>
      ${r.semLigacao ? `<div class="res warn" style="margin-top:10px">⚠ Sem ligação ao registo partilhado: não foi possível confirmar se já foi usado noutra loja.</div>` : ""}
      <button class="btn" id="use" style="margin-top:12px">Marcar como usado</button>`;
    $("#use").onclick = async () => {
      const cliente = $("#cli").value.trim().toUpperCase();
      if (cliente.length < 3) { $("#cli").focus(); $("#cli").style.borderColor = "var(--erro)"; return; }
      $("#use").disabled = true;
      const reg = { t: new Date().toISOString(), loja };
      // o código de cliente fica só neste dispositivo; para o registo partilhado vai apenas data e loja
      const all = used(); all[p.code] = { ...reg, cliente }; try { localStorage.setItem(UK, JSON.stringify(all)); } catch {}
      const n = await gravar(p.code, reg); $("#cli").value = "";
      out.innerHTML = n
        ? `<div class="res ok"><b>${p.code}</b> registado como usado em todas as lojas. Já não pode voltar a ser utilizado.</div>`
        : `<div class="res warn"><b>${p.code}</b> registado como usado <b>só neste dispositivo</b> (sem ligação ao registo partilhado).</div>`;
    };
  }
  $("#chk").onclick = check;
  $("#code").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  $("#csv").onclick = () => {
    const all = used(), rows = ["vale;data;loja;cliente"].concat(Object.keys(all).map(k => { const u = typeof all[k] === "string" ? { t: all[k] } : all[k]; return [k, u.t, u.loja || "", u.cliente || ""].join(";"); }));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv" })); a.download = "vales-usados.csv"; a.click();
  };
  updReg();
}

if (MODE === "phone") initPhone();
else if (MODE === "validate") initValidate();
else initScreen();
</script>
